{% extends "base.html" %}
{% block title %}Ekonomi Indonesia - Search{% endblock %}
{% block body_class %}page-home{% endblock %}

{% block content %}
<section class="hero-section">
    <div class="hero-overlay">
        <h1 class="hero-heading">Ekonomi Indonesia</h1>
        
        <form class="search-form" action="/search" method="GET">
            <div class="search-bar">
                <span class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#718096" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" name="q" id="search-input" placeholder="Cari artikel disini..." autofocus required autocomplete="off">
                <button type="button" class="btn-clear" id="btn-clear" onclick="clearSearch()" title="Hapus">✕</button>
            </div>
            <button type="submit" class="btn-submit">Cari</button>
        </form>
    </div>
</section>
{% endblock %}
